replicaCount: 1

image:
  repository: pawelrus1/k8s-automation-thesis-iac
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

container:
  port: 5000

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: flask-app
      paths:
        - path: /
          pathType: Prefix
  tls: []