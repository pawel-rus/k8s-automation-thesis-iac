name: Security Scans

on:
  workflow_dispatch: {}

jobs:
  sast-scans:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        scan:
          - { name: 'Application', path: 'src' }
          - { name: 'Helm', path: 'helmfile' }
          - { name: 'Ansible', path: 'infra/ansible' }
          - { name: 'Terraform', path: 'infra/terraform/envs' }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan for ${{ matrix.scan.name }}
        run: semgrep scan --config auto --json --output semgrep-report-${{ matrix.scan.name }}.json ${{ matrix.scan.path }}
        continue-on-error: true

      - name: Convert JSON report to HTML for ${{ matrix.scan.name }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq

          echo "<html><head><meta charset='utf-8'><title>${{ matrix.scan.name }} Semgrep Report</title></head><body><h1>Semgrep Results for ${{ matrix.scan.name }}</h1><table border='1' cellspacing='0' cellpadding='5'><tr><th>Check ID</th><th>Path</th><th>Line</th><th>Message</th><th>Severity</th></tr>" > semgrep-report-${{ matrix.scan.name }}.html

          jq -r '.results[] | "<tr><td>\(.check_id)</td><td>\(.path)</td><td>\(.start.line)</td><td>\(.extra.message)</td><td>\(.extra.severity)</td></tr>"' semgrep-report-${{ matrix.scan.name }}.json >> semgrep-report-${{ matrix.scan.name }}.html
          
          echo "</table></body></html>" >> semgrep-report-${{ matrix.scan.name }}.html

      - name: Upload HTML Semgrep report for ${{ matrix.scan.name }}
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report-${{ matrix.scan.name }}
          path: semgrep-report-${{ matrix.scan.name }}.html
          retention-days: 1

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .

  zap-dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flask-app-dast -f ./src/Dockerfile ./src

      - name: Run Docker container
        run: docker run -d -p 5000:5000 --name flask-app-container flask-app-dast

      - name: Wait for application to be ready
        run: sleep 15

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:5000'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-scan-report
          cmd_options: '-r zap-report.html'

      - name: Stop and remove Docker container
        if: always()
        run: docker stop flask-app-container && docker rm flask-app-container

  package-reports:
    name: Package All Security Reports
    runs-on: ubuntu-latest
    needs: [sast-scans, zap-dast-scan, secret-scan]
    
    steps:
      - name: Download all individual reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          merge-multiple: true

      - name: Upload final ZIP archive
        uses: actions/upload-artifact@v4
        with:
          name: all-security-reports
          path: all-reports/
          retention-days: 7
  
