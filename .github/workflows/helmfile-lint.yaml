name: Helmfile Lint

on:
  workflow_call:
    inputs:
      helmfile_path:
        description: 'The path to the Helmfile to lint'
        required: false
        type: string
        default: 'helmfile/aws-selfhosted/helmfile.gotmpl'

jobs:
  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Helmfile Lint
        uses: helmfile/helmfile-action@v2.0.5
        with:
          helmfile-args: -f ${{ inputs.helmfile_path }} lint