name: Deploy All Releases

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        options:
        - aws-selfhosted
        - eks-managed
      provider:
        description: 'The configuration directory/provider to use (e.g., "aws")'
        required: true
        type: choice
        options:
        - aws
        - azure
        default: 'aws'

jobs:
  deploy-all-services:
    name: Deploy all services to ${{ github.event.inputs.environment }}
    environment:
      name: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (for EKS only)
        if: github.event.inputs.environment == 'eks-managed'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Set up Kubeconfig from Secret
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.2'
      
      - name: Install helm-diff plugin
        run: |
          helm plugin install https://github.com/databus23/helm-diff --version v3.8.1
      
      - name: Install Prometheus Operator CRDs
        if: github.event.inputs.environment == 'eks-managed'
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus-operator-crds prometheus-community/prometheus-operator-crds --version 15.0.0 --namespace monitoring --create-namespace

      - name: Setup Helmfile
        run: |
          curl -L https://github.com/helmfile/helmfile/releases/download/v1.1.9/helmfile_1.1.9_linux_amd64.tar.gz -o /tmp/helmfile.tar.gz
          tar -xzf /tmp/helmfile.tar.gz -C /usr/local/bin helmfile
          chmod +x /usr/local/bin/helmfile
          helmfile version

      - name: Deploy all releases with Helmfile
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          helmfile -e ${{ github.event.inputs.environment }} --file helmfile/${{ github.event.inputs.provider }}/helmfile.yaml.gotmpl apply --interactive=false
