name: New Application Version Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'
      environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        options:
        - aws-selfhosted
        - eks-managed
      provider:
        description: 'Cloud provider'
        required: true
        type: choice
        options:
        - aws
        - azure

jobs:
  sast-scan:
    name: Application Code Scan (SAST)
    uses: ./.github/workflows/sast-scan.yaml

  dast-scan:
    name: OWASP ZAP DAST Scan
    uses: ./.github/workflows/dast-scan.yaml

  build-and-push:
    name: Build & Push Docker Image
    needs: [sast-scan, dast-scan]
    uses: ./.github/workflows/build-and-push.yaml
    with:
      tag: ${{ github.event.inputs.tag }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    
  helm-lint:
    name: Lint Helm Chart
    needs: [build-and-push]
    uses: ./.github/workflows/helm-lint.yaml

  helmfile-lint:
    name: Lint Helmfile
    needs: [build-and-push]
    uses: ./.github/workflows/helmfile-lint.yaml
    with:
      environment: ${{ github.event.inputs.environment }}
      workdir: helmfile/${{ github.event.inputs.provider }}

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    needs: [helm-lint, helmfile-lint]
    environment:
      name: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (for EKS only)
        if: inputs.environment == 'eks-managed'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Set up Kubeconfig from Secret
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy flask-app release with Helmfile
        uses: helmfile/helmfile-action@v2.0.5
        with:
          helmfile-args: >-
            -e ${{ github.event.inputs.environment }}
            -f helmfile/${{ github.event.inputs.provider }}/helmfile.yaml.gotmpl
            apply
            --selector name=flask-app
            --set image.tag=${{ github.event.inputs.tag }}
            --interactive=false