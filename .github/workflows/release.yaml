name: New Application Version Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'
      environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        options:
        - aws-selfhosted
        - eks-managed

jobs:
  sast-scan:
    name: Application Code Scan (SAST)
    uses: ./.github/workflows/sast-scan.yaml

  dast-scan:
    name: OWASP ZAP DAST Scan
    uses: ./.github/workflows/dast-scan.yaml

  build-and-push:
    name: Build & Push Docker Image
    needs: [sast-scan, dast-scan]
    uses: ./.github/workflows/build-and-push.yaml
    with:
      tag: ${{ github.event.inputs.tag }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    
  helm-lint:
    name: Lint Helm Chart
    needs: [build-and-push]
    uses: ./.github/workflows/helm-lint.yaml

  helmfile-lint:
    name: Lint Helmfile
    needs: [build-and-push]
    uses: ./.github/workflows/helmfile-lint.yaml

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    needs: [helm-lint, helmfile-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to aws-selfhosted
        run: echo "Deploying version ${{ github.event.inputs.tag }} to ${{ github.event.inputs.environment }} environment"