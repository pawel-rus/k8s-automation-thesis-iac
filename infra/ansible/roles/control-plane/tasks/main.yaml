---
- name: Create kubeadm-config.yaml file on the master node
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /tmp/kubeadm-config.yaml
    owner: root
    group: root
    mode: '0644'

- name: Initialize Kubernetes master node
  command: kubeadm init --config /tmp/kubeadm-config.yaml --upload-certs
  register: kubeadm_init
  args:
    creates: /etc/kubernetes/admin.conf

- name: Ensure .kube directory for {{ access_user }}
  file:
    path: "/home/{{ access_user }}/.kube"
    state: directory
    owner: "{{ access_user }}"
    group: "{{ access_user }}"
    mode: '0755'
  become: yes

- name: Copy kubeconfig to {{ access_user }} user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ access_user }}/.kube/config"
    remote_src: yes
    owner: "{{ access_user }}"
    group: "{{ access_user }}"
    mode: 0600

- name: Fetch kubeconfig to local machine
  fetch:
    src: "/home/{{ access_user }}/.kube/config"
    dest: "./../.kubeconfigs/{{ project_env }}-kubeconfig"
    flat: yes
  become: no

- name: Replace private server IP in kubeconfig with public IP
  replace:
    path: "./../.kubeconfigs/{{ project_env }}-kubeconfig"
    regexp: 'server: https://[0-9\.]+:6443'
    replace: "server: https://{{ master_public_ip }}:6443"
  delegate_to: localhost
  become: no
  
- name: Apply Calico network plugin
  command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v{{ calico_version }}/manifests/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Generate join command for workers
  command: kubeadm token create --print-join-command
  register: join_command

- name: Save join command fact
  set_fact:
    worker_join_cmd: "{{ join_command.stdout }}"
